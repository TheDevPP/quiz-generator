<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Category Selection -->
    <div id="screen-category" class="screen">
      <h1>Health Quiz</h1>
      <p class="subtitle">Real talk about health — no judgment, just facts.</p>
      <p id="completion-message" class="completion-message hidden">You've answered all questions in this category! Choose a category to continue:</p>
      <div class="category-list">
        <button class="category-btn" data-category="Adolescent Health">Adolescent Health</button>
        <button class="category-btn" data-category="General Health">General Health</button>
        <button class="category-btn" data-category="Sexual and Reproductive Health">Sexual &amp; Reproductive Health (SRH)</button>
      </div>
      <p class="privacy-notice">We don't collect any information about you. Ever.</p>
    </div>

    <!-- Quiz -->
    <div id="screen-quiz" class="screen hidden">
      <div class="quiz-top">
        <button id="btn-back" class="btn-back">&larr; Change Category</button>
        <span id="category-tag" class="category-tag"></span>
      </div>

      <div class="question-card">
        <div id="scenario-block" class="scenario-block hidden"></div>
        <p id="question-text" class="question-text"></p>
      </div>

      <div id="answers" class="answers"></div>

      <div id="feedback" class="feedback hidden">
        <p id="feedback-result" class="feedback-result"></p>
        <p id="feedback-explanation" class="feedback-explanation"></p>
      </div>

      <div class="quiz-actions">
        <button id="btn-next" class="btn-primary hidden">Next Question</button>
      </div>
    </div>

    <!-- Error -->
    <div id="screen-error" class="screen hidden">
      <div class="error-card">
        <p id="error-text" class="error-text"></p>
        <button id="btn-error-back" class="btn-primary">Back to Categories</button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
